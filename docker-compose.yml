version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cad_db
      POSTGRES_USER: cad_user
      POSTGRES_PASSWORD: cad_pass
    ports:
      - "5432:5432"
    volumes:
      - cad_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - postgres
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DATABASE_URL=postgresql://cad_user:cad_pass@postgres:5432/cad_db?schema=public

volumes:
  cad_postgres_data:
