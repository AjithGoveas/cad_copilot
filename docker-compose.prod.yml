version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cadvex_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: cad_db_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - cadvex_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: ./frontend
      target: builder
    container_name: cadvex_db_migrate_prod
    env_file:
      - ./frontend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/cad_db_2?schema=public
      - DIRECT_URL=postgresql://postgres:root@postgres:5432/cad_db_2?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npx prisma db seed"

  backend:
    build:
      context: ./backend
      target: production
    container_name: cadvex_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: cadvex_frontend_prod
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/cad_db_2?schema=public
      - DIRECT_URL=postgresql://postgres:root@postgres:5432/cad_db_2?schema=public
      - FASTAPI_URL=http://backend:8000/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  cadvex_postgres_data_prod:
